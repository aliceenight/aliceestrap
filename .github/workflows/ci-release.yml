name: CI (Release)
on: [push, pull_request]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v6
      with:
        submodules: true

    - name: Check version matches tag
      if: startsWith(github.ref, 'refs/tags/v')
      shell: pwsh
      run: |
        $version = ([xml](Get-Content .\Aliceestrap\Aliceestrap.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
        if ("v$version" -ne "${{ github.ref_name }}") {
          Write-Error "Tag ${{ github.ref_name }} does not match <Version>$version</Version> in Aliceestrap.csproj"
          exit 1
        }

    - uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build -c Release --no-restore

    - name: Publish
      run: dotnet publish -p:PublishSingleFile=true -p:CommitHash=${{ github.sha }} -p:CommitRef=${{ github.ref_type }}/${{ github.ref_name }} -r win-x64 -c Release --self-contained false .\Aliceestrap\Aliceestrap.csproj

    - name: Upload Artifact
      uses: actions/upload-artifact@v7
      with:
        path: .\Aliceestrap\bin\Release\net10.0-windows\win-x64\publish\aliceestrap.exe
        archive: false

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          path: release

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          files: release/**/aliceestrap.exe
          name: aliceestrap ${{ github.ref_name }}
          fail_on_unmatched_files: true
